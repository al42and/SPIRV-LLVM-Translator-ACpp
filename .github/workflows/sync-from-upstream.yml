name: Sync from upstream

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git

      - name: Fetch remotes
        run: |
          git fetch origin
          git fetch upstream

      - name: Sync branches
        run: |
          PATCH="$(mktemp)"
          FAILED=()
          for branch in main $(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/upstream/llvm_release_*' | awk -F_ '$3 ~ /^[0-9]+$/ && $3 >= 150' | sort -t_ -k3 -n); do
            echo "=== Syncing $branch ==="
            case "$branch" in
              llvm_release_1[5-9]0|llvm_release_2[0-2]0)
                PATCH_FILE=".github/patches/adaptivecpp-llvm15-22.patch" ;;
              llvm_release_230)
                PATCH_FILE=".github/patches/adaptivecpp-llvm23.patch" ;;
              *)
                PATCH_FILE=".github/patches/adaptivecpp.patch" ;;
            esac

            UPSTREAM_SHA=$(git rev-parse "upstream/$branch")
            if git show "patch:$PATCH_FILE" > "$PATCH" && \
               git checkout -fB "$branch" "upstream/$branch" && \
               git rm -rf --ignore-unmatch .github/workflows/ && \
               git apply --index "$PATCH"; then
              if git show-ref --verify --quiet "refs/remotes/origin/$branch" && \
                 [ "$UPSTREAM_SHA" = "$(git rev-parse "origin/$branch^1" 2>/dev/null || echo "")" ] && \
                 git diff --cached --quiet "origin/$branch"; then
                echo "Skipping $branch (already up to date)"
                continue
              fi

              if git commit -m "Apply AdaptiveCpp patch" && \
                 git push --force-with-lease origin "$branch"; then
                git show --stat --oneline HEAD
                echo "Done: $branch"
              else
                echo "::error::Failed to push $branch"
                FAILED+=("$branch")
              fi
            else
              echo "::error::Failed to apply $PATCH_FILE to $branch"
              FAILED+=("$branch")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::The following branches failed to sync: ${FAILED[*]}"
            exit 1
          fi
